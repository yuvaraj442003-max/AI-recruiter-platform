<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AI Recruiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 460px;">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none d-inline-block mb-3">
        <span class="fs-2">⚡</span>
        <span class="fw-bold fs-3 text-dark style-logo">AI Recruiter</span>
      </a>
      <h1 class="h4 fw-bold mb-1">Forgot Your Password?</h1>
      <p class="text-muted-custom small">Enter your email address and we'll generate a password reset link for you.</p>
    </div>

    <div class="card border-0 shadow-lg style-card" style="border-radius: 16px;">
      <div class="card-body p-4 p-md-5">

        <div id="forgot-alert" class="alert d-none py-2 mb-4" role="alert"></div>

        <form id="forgot-form" novalidate>
          <div class="mb-4">
            <label for="forgot-email" class="form-label fw-semibold text-dark small">Account Email Address</label>
            <input type="email" class="form-control" id="forgot-email" placeholder="name@example.com" required autocomplete="email" />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mb-3" id="forgot-submit">
            <span id="forgot-submit-text">Send Reset Link &rarr;</span>
            <span id="forgot-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
          </button>
        </form>



        <p class="text-center text-muted-custom mt-4 mb-0 small">
          Remember your password? <a href="login.html" class="fw-bold text-primary text-decoration-none">Back to Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
