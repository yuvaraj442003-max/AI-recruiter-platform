<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications — AI Recruiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-required-role="candidate">

  <div class="d-flex">
    <nav class="d-none d-md-flex flex-column bg-white border-end vh-100 sticky-top p-3" style="width: 260px; min-width: 260px;">
      <a href="candidate-portal.html" class="navbar-brand text-decoration-none d-flex align-items-center gap-2 mb-4 px-2">
        <span class="fs-4">👨‍💻</span>
        <span class="fw-bold text-dark fs-5">Candidate Portal</span>
      </a>
      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
          <a href="candidate-portal.html" class="nav-link text-dark fw-medium text-nowrap d-flex align-items-center gap-2">
            <span>🏠</span> Portal Home
          </a>
        </li>
        <li class="nav-item">
          <a href="candidate-dashboard.html" class="nav-link text-dark fw-medium text-nowrap d-flex align-items-center gap-2">
            <span>📊</span> Candidate Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="upload-resume.html" class="nav-link text-dark fw-medium text-nowrap d-flex align-items-center gap-2">
            <span>📄</span> Resume &amp; ATS Score
          </a>
        </li>
        <li class="nav-item">
          <a href="jobs.html" class="nav-link text-dark fw-medium text-nowrap d-flex align-items-center gap-2">
            <span>🔍</span> Find Jobs
          </a>
        </li>
        <li class="nav-item">
          <a href="my-applications.html" class="nav-link active text-nowrap d-flex align-items-center gap-2" style="background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: #fff;">
            <span>📑</span> My Applications
          </a>
        </li>
        <li class="nav-item">
          <a href="messages.html" class="nav-link text-dark fw-medium text-nowrap d-flex align-items-center gap-2">
            <span>💬</span> Messages &amp; Chat
          </a>
        </li>
      </ul>
      <div class="mt-auto pt-3 border-top">
        <button id="logout-btn" class="btn btn-outline-secondary w-100 fw-semibold">Log out</button>
      </div>
    </nav>

    <main class="flex-grow-1">
      <header class="bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0">My Applications</h1>
        <div class="d-flex align-items-center gap-3">
          <span id="user-greeting" class="text-muted-custom skeleton" style="width: 140px; height: 1rem; display: inline-block;"></span>
          <button id="logout-btn-mobile" class="btn btn-sm btn-outline-secondary d-md-none">Log out</button>
        </div>
      </header>

      <div class="container-fluid p-4">
        <div id="applications-wrapper">
          <div class="text-muted-custom">Loading your applications…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/my-applications.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
