<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Verification — AI Recruiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .otp-input-group input {
      width: 48px;
      height: 56px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      transition: all 0.2s ease-in-out;
    }
    .otp-input-group input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.25);
      outline: none;
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none d-inline-block mb-3">
        <span class="fs-2">⚡</span>
        <span class="fw-bold fs-3 text-dark style-logo">AI Recruiter</span>
      </a>
      <h1 class="h4 fw-bold mb-1">Enter Verification Code</h1>
      <p class="text-muted-custom small mb-0">We sent a 6-digit OTP code to your email address.</p>
    </div>

    <div class="card border-0 shadow-lg style-card" style="border-radius: 16px;">
      <div class="card-body p-4 p-md-5 text-center">

        <div id="verify-alert" class="alert d-none py-3 mb-4" role="alert"></div>

        <form id="otp-form" onsubmit="return false;">
          <div class="mb-3 text-start">
            <label class="form-label small text-muted fw-semibold mb-1">Email Address</label>
            <input type="email" id="email-input" class="form-control shadow-sm" placeholder="Enter registered email" required />
          </div>

          <div class="mb-4 text-start">
            <label class="form-label small text-muted fw-semibold mb-2">6-Digit Verification Code</label>
            <div class="d-flex justify-content-between gap-2 otp-input-group mb-2">
              <input type="text" maxlength="1" class="form-control otp-box" data-index="0" inputmode="numeric" pattern="[0-9]*" autofocus />
              <input type="text" maxlength="1" class="form-control otp-box" data-index="1" inputmode="numeric" pattern="[0-9]*" />
              <input type="text" maxlength="1" class="form-control otp-box" data-index="2" inputmode="numeric" pattern="[0-9]*" />
              <input type="text" maxlength="1" class="form-control otp-box" data-index="3" inputmode="numeric" pattern="[0-9]*" />
              <input type="text" maxlength="1" class="form-control otp-box" data-index="4" inputmode="numeric" pattern="[0-9]*" />
              <input type="text" maxlength="1" class="form-control otp-box" data-index="5" inputmode="numeric" pattern="[0-9]*" />
            </div>
          </div>

          <button id="verify-btn" type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
            Verify OTP Code &rarr;
          </button>
        </form>

        <div class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center">
          <button class="btn btn-link text-decoration-none btn-sm fw-semibold text-primary p-0" type="button" id="resend-btn">
            Resend OTP Code
          </button>
          <a href="login.html" class="btn btn-link text-decoration-none btn-sm fw-semibold text-secondary p-0">
            ✏️ Back to Login
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/verify-email.js"></script>
</body>
</html>
