<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — AI Recruiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 500px;">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none d-inline-block mb-3">
        <span class="fs-2">⚡</span>
        <span class="fw-bold fs-3 text-dark style-logo">AI Recruiter</span>
      </a>
      <h1 class="h4 fw-bold mb-1">Email Verification</h1>
      <p class="text-muted-custom small">Verifying your email address to secure your account...</p>
    </div>

    <div class="card border-0 shadow-lg style-card" style="border-radius: 16px;">
      <div class="card-body p-4 p-md-5 text-center">

        <div id="verify-spinner" class="spinner-border text-primary my-4" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>

        <div id="verify-alert" class="alert d-none py-3 mb-4" role="alert"></div>

        <div id="action-container" class="d-none mt-4">
          <a id="continue-btn" href="login.html" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
            Proceed to Login &rarr;
          </a>
        </div>

        <div id="resend-container" class="d-none mt-4">
          <p class="small text-muted mb-2">Need a new verification link?</p>
          <div class="input-group mb-3">
            <input type="email" id="resend-email" class="form-control form-control-sm" placeholder="Enter your email" />
            <button class="btn btn-outline-primary btn-sm fw-semibold" type="button" id="resend-btn">Resend Link</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/verify-email.js"></script>
</body>
</html>
