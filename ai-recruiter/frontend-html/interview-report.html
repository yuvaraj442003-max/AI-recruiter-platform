<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Report — AI Recruiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- html2pdf.js for client-side PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-expand navbar-light bg-body border-bottom shadow-sm no-print">
    <div class="container" style="max-width: 900px;">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
        <span>🤖</span> AI Recruiter
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <button id="btn-download-pdf" class="btn btn-sm btn-outline-primary fw-semibold d-none align-items-center gap-1">
          <span>📥</span> Download PDF
        </button>
        <button id="btn-print-report" class="btn btn-sm btn-outline-secondary fw-semibold d-none align-items-center gap-1">
          <span>🖨️</span> Print Report
        </button>
        <a id="back-link" href="#" class="btn btn-sm btn-secondary fw-semibold ms-2">Back</a>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 900px;">
    <div id="report-alert" class="alert d-none py-2 no-print" role="alert"></div>

    <div id="report-printable-area">
      <div id="report-wrapper">
        <div class="text-muted p-4 text-center">Loading interview evaluation report…</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/interview-report.js"></script>
</body>
</html>
