<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Question Bank — AI Recruiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🤖 AI Recruiter</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="recruiter-dashboard.html">Dashboard</a>
        <a class="nav-link active" href="coding-question-management.html">Question Bank</a>
        <a class="nav-link" href="post-job.html">Post Job</a>
        <a class="nav-link" href="#" id="logout-btn">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">💻 Coding Question Bank</h2>
        <p class="text-muted">Create and manage coding assessment questions and test cases.</p>
      </div>
      <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#createQuestionModal">
        + Create New Question
      </button>
    </div>

    <!-- Question List Card -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-semibold">Available Coding Questions</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Difficulty</th>
                <th>Languages</th>
                <th>Test Cases</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="questions-table-body">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Loading questions...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Question Modal -->
  <div class="modal fade" id="createQuestionModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Create Coding Question</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="create-question-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Title</label>
              <input type="text" id="q-title" class="form-control" placeholder="e.g. Find Duplicate Numbers" required />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Category</label>
                <select id="q-category" class="form-select">
                  <option value="Arrays">Arrays</option>
                  <option value="Strings">Strings</option>
                  <option value="Hash Maps">Hash Maps</option>
                  <option value="Sorting">Sorting</option>
                  <option value="Recursion">Recursion</option>
                  <option value="Trees">Trees</option>
                  <option value="Graphs">Graphs</option>
                  <option value="Dynamic Programming">Dynamic Programming</option>
                  <option value="SQL">SQL</option>
                  <option value="Algorithms">Algorithms</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Difficulty</label>
                <select id="q-difficulty" class="form-select">
                  <option value="Easy">Easy</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="Hard">Hard</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea id="q-description" class="form-control" rows="3" placeholder="Detailed problem statement..." required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Constraints / Explanation</label>
              <input type="text" id="q-constraints" class="form-control" placeholder="e.g. 1 <= N <= 10^5, O(n) time complexity required" />
            </div>

            <hr />
            <h6 class="fw-bold mb-3">Test Cases (Public & Hidden)</h6>
            <div id="test-cases-container">
              <div class="row g-2 mb-2 test-case-row">
                <div class="col-md-4">
                  <input type="text" class="form-control tc-input" placeholder="Input (STDIN)" required />
                </div>
                <div class="col-md-4">
                  <input type="text" class="form-control tc-output" placeholder="Expected Output" required />
                </div>
                <div class="col-md-3 d-flex align-items-center">
                  <div class="form-check me-2">
                    <input class="form-check-input tc-hidden" type="checkbox" />
                    <label class="form-check-label small">Hidden</label>
                  </div>
                  <input type="number" class="form-control tc-points" value="10" placeholder="Points" style="width: 70px;" />
                </div>
              </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addTestCaseRow()">+ Add Test Case</button>

            <div class="modal-footer px-0 pb-0">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Question</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      loadQuestions();

      document.getElementById('logout-btn').onclick = () => {
        Session.clear();
        window.location.href = 'login.html';
      };

      document.getElementById('create-question-form').onsubmit = async (e) => {
        e.preventDefault();
        const testCases = [];
        document.querySelectorAll('.test-case-row').forEach(row => {
          const input_data = row.querySelector('.tc-input').value.trim();
          const expected_output = row.querySelector('.tc-output').value.trim();
          const is_hidden = row.querySelector('.tc-hidden').checked;
          const points = parseInt(row.querySelector('.tc-points').value) || 10;
          if (input_data && expected_output) {
            testCases.push({ input_data, expected_output, is_hidden, points });
          }
        });

        const payload = {
          title: document.getElementById('q-title').value.trim(),
          category: document.getElementById('q-category').value,
          difficulty: document.getElementById('q-difficulty').value,
          description: document.getElementById('q-description').value.trim(),
          constraints: document.getElementById('q-constraints').value.trim(),
          programming_languages: ['python', 'javascript', 'java', 'cpp', 'csharp'],
          test_cases: testCases
        };

        try {
          const res = await codingAPI.createQuestion(payload);
          if (res.success) {
            bootstrap.Modal.getInstance(document.getElementById('createQuestionModal')).hide();
            document.getElementById('create-question-form').reset();
            loadQuestions();
          } else {
            alert('Error creating question: ' + res.message);
          }
        } catch (err) {
          alert('Failed to create question: ' + err.message);
        }
      };
    });

    async function loadQuestions() {
      const tbody = document.getElementById('questions-table-body');
      try {
        const res = await codingAPI.listQuestions();
        if (res.success && res.data.length > 0) {
          tbody.innerHTML = res.data.map(q => `
            <tr>
              <td class="fw-semibold">${q.title}</td>
              <td><span class="badge bg-secondary">${q.category}</span></td>
              <td>
                <span class="badge bg-${q.difficulty === 'Easy' ? 'success' : q.difficulty === 'Medium' ? 'warning' : 'danger'}">
                  ${q.difficulty}
                </span>
              </td>
              <td class="small text-muted">${q.programming_languages.join(', ')}</td>
              <td><span class="badge bg-info text-dark">${q.test_cases.length} cases</span></td>
              <td><button class="btn btn-sm btn-outline-primary" onclick="alert('Viewing question: ${q.title}')">View</button></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No questions available.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Failed to load questions.</td></tr>';
      }
    }

    function addTestCaseRow() {
      const container = document.getElementById('test-cases-container');
      const div = document.createElement('div');
      div.className = 'row g-2 mb-2 test-case-row';
      div.innerHTML = `
        <div class="col-md-4">
          <input type="text" class="form-control tc-input" placeholder="Input (STDIN)" required />
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control tc-output" placeholder="Expected Output" required />
        </div>
        <div class="col-md-3 d-flex align-items-center">
          <div class="form-check me-2">
            <input class="form-check-input tc-hidden" type="checkbox" />
            <label class="form-check-label small">Hidden</label>
          </div>
          <input type="number" class="form-control tc-points" value="10" placeholder="Points" style="width: 70px;" />
        </div>
      `;
      container.appendChild(div);
    }
  </script>
</body>
</html>
